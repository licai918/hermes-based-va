name: CI

# Slice 29 (issue #31): the text_first_launch full-suite CI gate. Three parallel
# jobs make a PR mergeable only when the TypeScript surfaces typecheck + test, the
# Python plugin/eval suites pass, and the authoritative Launch Eval replay gate
# reports zero high-severity failures (ADR-0010, ADR-0074, ADR-0121).
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref supersedes in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # NFR-6: no credential lands in a commit. One job for the whole repo (0.0.4
  # S12) -- S14's EasyRoutes tokens and every later integration add a name to
  # SECRET_VARS in the script, not another job. No checkout depth needed: the
  # gate scans the tree at this ref, which is what a merge would publish.
  secret-scan:
    name: Secret scan (tracked files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Selfcheck the gate's own rules
        run: node scripts/secret-scan.mjs --selfcheck
      - name: Scan tracked files
        run: node scripts/secret-scan.mjs

  node:
    name: Node typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck all workspaces
        run: pnpm -r typecheck
      - name: Unit tests (workbench + packages)
        run: pnpm test

  eval-gate:
    name: Launch Eval gate (text_first_launch + email_go_live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Plugin + eval_runner unit tests
        working-directory: hermes
        run: uv run --frozen pytest -q
      # Authoritative go-live gate: replays recorded transcripts deterministically
      # (no network/LLM) and exits non-zero on any high-severity scenario failure.
      - name: Launch Eval replay gate (text_first_launch)
        working-directory: hermes
        run: uv run --frozen python -m eval_runner --suite text_first_launch --harness replay --transcripts-dir ../eval/transcripts
      # S19/FR-27: the email suite is a REQUIRED check too -- a separate step in the
      # SAME job, so both suites must be green for eval-gate to pass and the email
      # pipeline can no longer silently regress.
      - name: Launch Eval replay gate (email_go_live)
        working-directory: hermes
        run: uv run --frozen python -m eval_runner --suite email_go_live --harness replay --transcripts-dir ../eval/transcripts

  runtime:
    name: Hermes runtime + gateway embedding
    runs-on: ubuntu-latest
    # Matches docker-compose.yml's postgres service (same user/pass/db) so the
    # datastore/E2E acceptance tests (hermes-runtime/tests/conftest.py's
    # temp_schema_conn) find a real Postgres instead of skipping (ADR-0142).
    # POSTGRES_USER is granted superuser by the official image, so `toee` can
    # CREATE DATABASE -- the knowledge fixtures self-provision toee_knowledge
    # via ensure_database() with zero extra CI setup (S30/NFR-7).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toee
          POSTGRES_PASSWORD: toee
          POSTGRES_DB: toee_va
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://toee:toee@localhost:5432/toee_va
      KNOWLEDGE_DATABASE_URL: postgresql://toee:toee@localhost:5432/toee_knowledge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      # toee_va needs the business migrations applied before the tests run (some,
      # e.g. test_knowledge_ingest.py's policy-slot read, hit the DB's default
      # schema directly rather than a throwaway one). toee_knowledge has no
      # equivalent step: it self-provisions + self-migrates inside the test
      # fixtures (ensure_database / run_migrations against a throwaway schema).
      - name: Apply business datastore migrations (toee_va)
        working-directory: hermes-runtime
        run: uv run --frozen python -m hermes_runtime.datastore.migrate
      # Installs the pinned upstream hermes-agent (git rev) and exercises the
      # embedded AIAgent turn + FastAPI gateway webhook routes.
      #
      # NFR-7 gate: -rs prints one summary line per skip. The live-Postgres
      # suites (hermes-runtime/tests/test_datastore_*.py, test_knowledge_*.py,
      # test_job_queue.py) previously skipped silently with no Postgres in CI
      # (the 0.0.1 debt) -- now that a Postgres service is provisioned above,
      # any skip left in those files fails the job, except the one documented,
      # intentional skip: the live-embedder smoke tests guard themselves with
      # "fastembed not installed" (fastembed is not a project dependency, so
      # this always skips in CI -- no 100MB+ model download).
      #
      # test_job_queue.py (0.0.4 S01), test_turn_worker.py (S02),
      # test_outbound_send.py (S03) and test_background_worker.py (S04) are in the
      # pattern because those tests are the ENTIRE evidence for the durable-queue,
      # crash-recovery, outbound-idempotency and FR-9 worker-isolation acceptance
      # gates -- a silent skip there is a green build proving nothing. S03's is the
      # one that proves a replayed turn does not text a customer twice; S04's is
      # the one that proves a long ingest cannot delay a customer's turn.
      #
      # test_composio_sdk_pin.py (0.0.4 S12) is in the pattern for a different
      # reason: it guards on `pytest.importorskip("composio")`, so dropping the SDK
      # from the lock would make the ENTIRE pin gate vanish while CI stayed green --
      # the one gate whose job is to notice an SDK surface change (fix wave 1,
      # review Finding 8).
      #
      # test_integration_probe.py (0.0.4 S16) carries the live-Postgres evidence
      # for the FR-24 probe result STORAGE + the page's last_probe fill; a silent
      # skip there is a green build proving nothing about the health surface.
      - name: Runtime + gateway tests
        working-directory: hermes-runtime
        run: |
          set -o pipefail
          uv run --frozen pytest -q -rs 2>&1 | tee /tmp/pytest-runtime.log
          if grep -E '^SKIPPED .*tests/test_(datastore_|knowledge_|job_queue|turn_worker|outbound_send|background_worker|dead_letter_view|composio_sdk_pin|integration_probe)' /tmp/pytest-runtime.log \
              | grep -v 'fastembed not installed'; then
            echo "::error::live-Postgres test skipped despite CI Postgres (NFR-7) -- see hermes-runtime/tests"
            exit 1
          fi

  # NFR-9 (0.0.4 S25): boots the FULL turn-path topology in CI -- gateway + both
  # dispatch servers + turn worker + background worker + Postgres -- so the
  # scripted-mode live-eval suites (S18/S19) have a real turn path here, not just
  # the `runtime` job's in-process embedding. This job owns ONLY the CI-infra lift;
  # the scenario-level scripted harness is S18 and runs ON this topology.
  #
  # It reuses `scripts/dev-up.mjs --stack-only` verbatim (the S10 orchestration that
  # already carries the pg_isready + per-server /healthz + worker "polling for"
  # readiness waits) rather than re-implementing compose steps in YAML -- one place
  # owns "the stack is actually up".
  #
  # Determinism / no real model: REPLY_SENDER=simulated (no provider POST) and no
  # INTEGRATION_DRIVER (the mock tool driver) are the defaults. OPENROUTER_API_KEY
  # is set to a PLACEHOLDER, not a secret: gateway_composition.resolve_openrouter_config
  # fails closed on a blank key, so the topology needs *a* value to boot, but the
  # smoke never asserts a model reply -- it proves the durable turn-path seam that
  # needs no LLM (gateway fast-ack writes a `job` row; the turn worker claims it).
  # The scenario-level "scripted determinism proof" is DEFERRED to S18, whose own
  # acceptance already says it runs "in CI on the S25 topology".
  harness-topology:
    name: Harness topology (full turn-path stack)
    runs-on: ubuntu-latest
    # S18 (FR-26): an explicit non-prod label so the scripted-eval seam's allowlist guard
    # arms (compose interpolates ${DEPLOY_ENVIRONMENT:-development}). Job-level, not the
    # container env_file, because a compose `environment:` value wins over env_file -- so
    # this is the one place that actually reaches the gateway + turn-worker.
    env:
      DEPLOY_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # docker + compose v2 are preinstalled on ubuntu-latest; dev-up.mjs and the
      # smoke are pure Node, so no pnpm/uv install is needed on the host (the uv
      # sync happens inside the hermes-runtime image build, phase 2 below).
      #
      # The compose services read OPENROUTER_API_KEY / the webhook token only from
      # hermes-runtime/.env (env_file, gitignored). CI has no such file, so write a
      # throwaway one with the placeholder key + the dev webhook token the smoke
      # posts with. Absent this, the fail-closed boot rejects every turn-path server.
      - name: Write CI harness env (placeholder key; no secret)
        run: |
          cat > hermes-runtime/.env <<'EOF'
          OPENROUTER_API_KEY=ci-placeholder-no-real-model
          SIMPLETEXTING_WEBHOOK_TOKEN=dev-webhook-token
          REPLY_SENDER=simulated
          EVAL_SCRIPTED_MODE=1
          EOF
      - name: Selfcheck the smoke's parser
        run: node scripts/ci-harness-smoke.mjs --selfcheck
      # `time` records the boot budget the spec asks to document. The cold cost is
      # the hermes-runtime image build (uv sync, ~3-4 min); a warm local boot is
      # ~20s. No docker layer caching wired here on purpose -- it needs buildx +
      # a cache backend, which is more machinery than one CI job's boot warrants.
      - name: Boot full topology (dev-up --stack-only)
        run: |
          time node scripts/dev-up.mjs --stack-only
          docker compose ps
      - name: Harness-topology smoke (inbound turn claimed, twice)
        env:
          SIMPLETEXTING_WEBHOOK_TOKEN: dev-webhook-token
        run: node scripts/ci-harness-smoke.mjs
      # S18 (FR-26): the scenario-level scripted-determinism proof S25 deferred. Drives
      # the text_first_launch suite through the SAME running gateway/queue/turn-worker
      # topology (EVAL_SCRIPTED_MODE=1 armed the worker above), scripted -> no OpenRouter,
      # and fails on any high-severity scenario or any assertion drift between two runs.
      # Runs in the hermes-runtime image (turn-worker service: has the package, the eval
      # mount, DATABASE_URL, and the compose network to reach the gateway).
      - name: Scripted eval harness (text_first_launch, deterministic twice)
        run: |
          docker compose run --rm --no-deps turn-worker \
            uv run --frozen python -m hermes_runtime.scripted_gateway_harness \
              --suite text_first_launch --gateway-url http://gateway:8080 --runs 2
      # "teardown leaves no orphan services" (spec) -- always, even on smoke failure.
      - name: Tear down (no orphans)
        if: always()
        run: docker compose down -v

  # S20 (FR-28/FR-29): the ADVISORY live-model judge. Every PR runs the S27-tuned judge
  # (real OpenRouter model) over the labelled scenario set and attaches a report as a CI
  # artifact + one upserted PR comment. It is NON-REQUIRED and CANNOT block merge:
  #   * nothing `needs:` it and it is not in any branch-protection required-status set
  #     (the required wall stays the `eval-gate` scripted replay gate -- NFR-7);
  #   * the runnable exits 0 on judge misses AND flakes (advisory = report what happened,
  #     no retry theater -- FR-29). Only a genuine "cannot run at all" infra fault fails
  #     this job, and even then, being non-required, it blocks nothing.
  # Owner-key handling: OPENROUTER_API_KEY is an owner-provided repo secret. When ABSENT
  # (empty) the job SKIPS gracefully (skipped report, exit 0) -- so PRs are never blocked
  # before the owner configures it, and it lights up the moment they do. pull_request only.
  advisory-judge:
    name: Advisory live-model judge (non-blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      # The runnable owns the graceful-skip: openrouter_configured() reads this env; an
      # empty secret -> skipped report + exit 0. The key is NEVER printed or committed.
      - name: Run advisory judge over the scenario set
        working-directory: hermes-runtime
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run --frozen python -m hermes_runtime.advisory_judge_report \
            --out "$GITHUB_WORKSPACE/advisory-judge-report.md"
      - name: Upload advisory report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisory-judge-report
          path: advisory-judge-report.md
          if-no-files-found: warn
      # Upsert ONE PR comment (marker-keyed) so re-runs edit it in place, not spam.
      - name: Upsert advisory PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'advisory-judge-report.md';
            const marker = '<!-- s20-advisory-judge-report -->';
            let body;
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            } else {
              // Infra fault before the report was written -- still non-blocking, just say so.
              body = `${marker}\n## Advisory judge report\n\n_The advisory judge job could not produce a report this run (infra fault). This is advisory only and never blocks merge (NFR-7)._\n`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
