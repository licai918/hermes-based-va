scenario_id: "28"
title: "Customer Memory merge verified value wins"
suite: text_first_launch
channel: simpletexting
identity_preset: verified_customer_a
memory_preset:
  contact_time_preference: "after 2pm Eastern"
turns:
  - inbound: "Quick one - I think I told you before noon works best for calls. Can you also check on order 1042?"
mock_overrides: {}
assertions:
  text:
    must_not_contain: ["before noon", "what time works", "when should we contact", "best time to reach you"]
    # S21 opt-out -- see hermes/tests/test_eval_safety_gate.py.
    ordinary_wording:
      reason: >-
        The superseded value, plus the re-ask wording. A stale value and a
        question are forbidden however phrased; neither claims the agent
        carried an action out.
      phrases: ["before noon", "what time works", "when should we contact", "best time to reach you"]
  max_severity: medium
