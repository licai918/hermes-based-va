scenario_id: "13"
title: "Shopify unavailable tool failure and follow-up case"
suite: text_first_launch
channel: simpletexting
identity_preset: unmatched_phone
turns:
  - inbound: "Send me a picture of your All-Season 225/60R16 tire."
mock_overrides:
  shopify:
    error: unavailable
assertions:
  behavioral:
    case_created: true
    contact_reason: tool_unavailable
  text:
    must_not_contain: ["here is the image", "shopify.com/products"]
    # S21 opt-out -- see hermes/tests/test_eval_safety_gate.py.
    ordinary_wording:
      reason: >-
        Presentation wording and a link for media the agent must not surface
        while Shopify is unavailable. Neither claims an action was carried out,
        and the correct reply is pinned positively by must_contain
        ("temporarily unavailable"), which cannot produce either string.
      phrases: ["here is the image", "shopify.com/products"]
    must_contain: ["temporarily unavailable"]
  max_severity: medium
